<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>湖にうんちを浮かべるゲーム</title>
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; touch-action: none; -webkit-user-select: none; user-select: none; }
  *, *::before, *::after { box-sizing: inherit; }
  #stage {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); overflow: hidden; background: #bfe6ff;
    container-type: inline-size;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: #222; color: #fff; font: bold 20px sans-serif; text-align: center;
  }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(#bfe6ff, #7cc4ee);
    padding-top: calc(env(safe-area-inset-top, 0px) + 24cqw);
  }
  #title h1 {
    margin: 0; padding: 0 6cqw; text-align: center; color: #5a3a1a; word-break: keep-all;
    font-size: 10.5cqw; line-height: 1.35; text-shadow: 0 0.6cqw 0 #fff;
  }
  button { font-family: inherit; }
  #play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 8cqw; font-weight: bold; white-space: nowrap;
    padding: 0.6em 1.8em; border: none; border-radius: 999px;
    color: #fff; background: #e53935; box-shadow: 0 1.4cqw 0 #a02320;
  }
  #play:active { transform: translate(-50%, calc(-50% + 1cqw)); box-shadow: 0 0.4cqw 0 #a02320; }

  #shopBtn {
    position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    font-size: 4.2cqw; font-weight: bold; color: #fff; background: #f59e0b;
    border: none; border-radius: 999px; padding: 0.5em 1.1em; box-shadow: 0 3px 0 #b36f00;
  }
  #shopBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b36f00; }
  #coinHud {
    position: absolute; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    font-size: 4.2cqw; font-weight: bold; color: #5a3a1a; background: rgba(255, 248, 232, 0.9);
    border-radius: 999px; padding: 0.5em 1.1em;
  }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; }
  #slotBar { display: flex; gap: 2cqw; padding: 0 2cqw 1.5cqw; }
  .pill {
    font-size: 4cqw; font-weight: bold; color: #fff; background: #2f80c0; border: none;
    border-radius: 999px; padding: 0.4em 1.2em; box-shadow: 0 3px 0 #1f5b8c;
  }
  .pill:active { transform: translateY(2px); box-shadow: 0 1px 0 #1f5b8c; }
  #slots {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 2cqw;
    padding: 2cqw 2cqw calc(2cqw + env(safe-area-inset-bottom, 0px));
  }
  .slot {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 9cqw; line-height: 1; border-radius: 14%;
    background: rgba(8, 40, 80, 0.88); border: 2px solid rgba(255, 255, 255, 0.45);
  }
  .slot.empty { background: rgba(8, 40, 80, 0.55); border-style: dashed; border-color: rgba(255, 255, 255, 0.3); }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55); padding: 0 6cqw;
  }
  .card {
    width: 100%; background: #fff8e8; color: #5a3a1a; border-radius: 4cqw; padding: 4cqw;
    font-size: 4.4cqw;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3cqw; font-weight: bold; }
  .head .t { font-size: 6cqw; }
  #closeShop, #closeEdit { border: none; background: #ddd0b4; color: #5a3a1a; border-radius: 50%; width: 9cqw; height: 9cqw; font-size: 5cqw; }
  .item {
    display: flex; align-items: center; gap: 3cqw; width: 100%; margin-bottom: 2cqw; text-align: left;
    background: #fff; color: inherit; border: 3px solid #e8dcc0; border-radius: 3cqw; padding: 2cqw 3cqw;
    font-size: inherit;
  }
  .item.sel { border-color: #f59e0b; background: #fff3d1; }
  .item .em { font-size: 10cqw; line-height: 1; }
  .item .nm { flex: 1; font-weight: bold; }
  .item .nm small { display: block; font-weight: normal; font-size: 3.6cqw; opacity: 0.75; }
  .item .pr { font-weight: bold; }
  .bigbtn {
    width: 100%; border: none; border-radius: 999px; padding: 0.6em; margin-top: 1cqw;
    font-size: 5cqw; font-weight: bold; color: #fff; background: #e53935; box-shadow: 0 4px 0 #a02320;
  }
  .bigbtn:disabled { background: #bbb; box-shadow: 0 4px 0 #888; }
  #msg { min-height: 1.4em; margin-top: 2cqw; text-align: center; font-size: 4cqw; }

  #synthHint { font-size: 3.6cqw; opacity: 0.8; margin-bottom: 2cqw; }
  #synthCanvas {
    display: block; width: 100%; aspect-ratio: 1; border-radius: 3cqw; touch-action: none;
    border: 3px solid #e8dcc0;
  }
  #synthMsg { min-height: 1.4em; margin-top: 2cqw; text-align: center; font-size: 3.8cqw; color: #c62828; font-weight: bold; }
  #synthBtns { display: flex; gap: 3cqw; margin-top: 3cqw; }
  #synthBtns button {
    flex: 1; border: none; border-radius: 3cqw; padding: 0.4em; font-size: 7cqw; font-weight: bold;
    background: #ddd0b4; color: #5a3a1a; box-shadow: 0 3px 0 #b9a984;
  }
  #synthBtns button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b9a984; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2cqw; margin-bottom: 3cqw; }
  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5cqw;
    min-height: 15cqw; padding: 1.5cqw 0; font-size: 3cqw; font-weight: bold; color: inherit;
    background: #fff; border: 3px solid #e8dcc0; border-radius: 2.5cqw;
  }
  .chip .em { font-size: 7cqw; line-height: 1; }
  .chip.sel { border-color: #f59e0b; background: #fff3d1; }
  #editHint { font-size: 3.6cqw; opacity: 0.8; margin-bottom: 2cqw; }
  .chip.empty { opacity: 0.55; border-style: dashed; }
  button.chip:active { background: #fff3d1; border-color: #f59e0b; }
  .sec { font-weight: bold; margin: 1cqw 0 2cqw; }
  #edit .card { max-height: 90%; overflow: auto; }
  #pickTitle { font-weight: bold; margin-bottom: 3cqw; }
  #pickCancel { background: #9aa4ad; box-shadow: 0 4px 0 #6f7983; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" class="hidden"></canvas>
  <div id="title">
    <h1>湖にうんちを<br>浮かべるゲーム</h1>
    <button id="play">プレイ</button>
  </div>
  <button id="shopBtn" class="hidden">ショップ</button>
  <div id="coinHud" class="hidden"></div>
  <div id="bottom" class="hidden">
    <div id="slotBar"><button id="editBtn" class="pill">編集</button><button id="synthBtn" class="pill">合成</button></div>
    <div id="slots"></div>
  </div>
  <div id="shop" class="overlay hidden">
    <div class="card">
      <div class="head"><span class="t">ショップ</span><span id="coins"></span><button id="closeShop">✕</button></div>
      <div id="items"></div>
      <button id="buy" class="bigbtn" disabled>買う</button>
      <div id="pick" class="hidden">
        <div id="pickTitle">どのスロットと入れ替える?(外した動物は倉庫へ)</div>
        <div id="pickSlots" class="grid"></div>
        <button id="pickCancel" class="bigbtn">やめる</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="edit" class="overlay hidden">
    <div class="card">
      <div class="head"><span class="t">編集</span><button id="closeEdit">✕</button></div>
      <div id="editHint">タップで選んで、スロットと倉庫の動物を入れ替えられます</div>
      <div class="sec">セット中</div>
      <div id="editSet" class="grid"></div>
      <div class="sec">倉庫</div>
      <div id="editStore" class="grid"></div>
      <button id="unsetBtn" class="bigbtn" disabled>選んだ動物を倉庫に戻す</button>
    </div>
  </div>
  <div id="synth" class="overlay hidden">
    <div class="card">
      <div class="head"><span class="t">合成</span></div>
      <div id="synthHint">ドラッグで動かして、ボタンで回転・拡大縮小しながら組み合わせよう</div>
      <canvas id="synthCanvas"></canvas>
      <div id="synthBtns"><button id="rotL">↺</button><button id="rotR">↻</button><button id="zoomOut">－</button><button id="zoomIn">＋</button></div>
      <div id="synthMsg"></div>
      <button id="synthDone" class="bigbtn">完成</button>
    </div>
  </div>
</div>
<div id="rotate">スマホを縦向きにしてください</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stageEl = $('stage'), titleEl = $('title'), canvas = $('game'), ctx = canvas.getContext('2d');
  var coinHud = $('coinHud'), slotsEl = $('slots'), bottomEl = $('bottom'), editEl = $('edit'), shopEl = $('shop'), shopBtn = $('shopBtn');
  var synthEl = $('synth'), synthCanvas = $('synthCanvas'), sctx = synthCanvas.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var running = false, paused = false;

  // ---- animals: each one has a different poop shape ----
  var ANIMALS = {
    rabbit: { emoji: '🐰', name: 'うさぎ', shape: 'round', desc: 'まるいうんち', price: 100, r: 0.05, life: 30 },
    dog:    { emoji: '🐶', name: 'いぬ',   shape: 'swirl', desc: 'とぐろのうんち', price: 200, r: 0.055, life: 45 },
    cow:    { emoji: '🐮', name: 'うし',   shape: 'pie',   desc: 'ぺちゃんこうんち', price: 300, r: 0.055, life: 20 }
  };
  var SLOT_COUNT = 5;
  var slots = [];   // { id } or null
  var storage = []; // owned animals that are not set in a slot (倉庫)
  var picking = false;
  var shopChanged = false;   // something was bought since the shop was opened
  var coins = 1000;
  var selected = null;
  var incomeT = 0;
  var floaters = [];

  // ---- recipe: the poops placed together on the synthesis screen ----
  // each part: { shape, r, ox, oy, rot }  (lengths in units of stage width)
  var recipe = [];
  var synthSel = 0;
  var SYNTH_ZOOM = 2.5;
  var synthCss = 0;

  // ---- physics ----
  var GRAVITY = 1200;
  var WATER_DRAG = 3;
  var SPAWN_INTERVAL = 3;
  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: 0, eq: 0.15, m: 0.03, th: 0, w: 0, invI: 0, parts: [{ ox: 0, oy: 0, wx: 0, wy: 0, r: 0 }], R: 0 };
  var ANG_DRAG = 6;   // water resistance against spinning
  var poops = [];
  var dragging = null;       // { dx, dy } while the red ball is being dragged
  var ballFalling = false;   // released, not landed yet
  var ballTouched = false;   // the ball touched a poop during this step
  var spawnT = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = stageEl.clientWidth; H = stageEl.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = Math.min(W, H) * 0.06;
    ball.r = r; ball.parts[0].r = r; ball.R = r;
    ball.x = Math.min(Math.max(ball.x || W / 2, r), W - r);
  }
  window.addEventListener('resize', resize);

  // ---- slots UI ----
  function renderSlots() {
    slotsEl.innerHTML = '';
    for (var i = 0; i < SLOT_COUNT; i++) {
      var d = document.createElement('div');
      d.className = 'slot' + (slots[i] ? '' : ' empty');
      d.textContent = slots[i] ? ANIMALS[slots[i].id].emoji : '';
      slotsEl.appendChild(d);
    }
  }

  function updateCoins() {
    $('coins').textContent = '💰 ' + coins;
    coinHud.textContent = '💰 ' + coins;
  }

  // ---- shop UI ----
  function renderShop() {
    updateCoins();
    var box = $('items'); box.innerHTML = '';
    Object.keys(ANIMALS).forEach(function (id) {
      var a = ANIMALS[id];
      var b = document.createElement('button');
      b.className = 'item' + (selected === id ? ' sel' : '');
      b.innerHTML = '<span class="em">' + a.emoji + '</span><span class="nm">' + a.name +
        '<small>' + a.desc + '・' + a.life + '秒で壊れる</small></span><span class="pr">💰 ' + a.price + '</span>';
      b.addEventListener('click', function () { selected = id; $('msg').textContent = ''; renderShop(); });
      box.appendChild(b);
    });
    $('buy').disabled = !selected;
  }
  function showShopMain() {
    picking = false;
    $('items').classList.remove('hidden'); $('buy').classList.remove('hidden'); $('pick').classList.add('hidden');
  }
  function openShop() { paused = true; shopChanged = false; $('msg').textContent = ''; showShopMain(); renderShop(); shopEl.classList.remove('hidden'); }
  function closeShop() {
    paused = false; shopEl.classList.add('hidden');
    if (shopChanged) { shopChanged = false; openSynth(); }
  }
  function finishPurchase(k, at) {
    renderSlots(); updateCoins();
    addPart(selected, k, at);
    shopChanged = true;                // the synthesis screen opens when the shop is closed
    showShopMain(); renderShop();
    $('msg').textContent = ANIMALS[selected].name + 'を買いました!';
  }
  function buy() {
    if (!selected) return;
    var a = ANIMALS[selected], free = slots.indexOf(null);
    if (coins < a.price) { $('msg').textContent = 'コインが足りません'; return; }
    if (free < 0) { startPick(); return; }   // slots are full: choose which one to replace
    coins -= a.price;
    slots[free] = { id: selected };
    finishPurchase(free, null);
  }
  function startPick() {
    picking = true;
    $('items').classList.add('hidden'); $('buy').classList.add('hidden'); $('pick').classList.remove('hidden');
    $('msg').textContent = '';
    var box = $('pickSlots'); box.innerHTML = '';
    slots.forEach(function (sl, i) {
      var a = ANIMALS[sl.id], b = document.createElement('button');
      b.className = 'chip';
      b.innerHTML = '<span class="em">' + a.emoji + '</span><span>' + a.name + '</span>';
      b.addEventListener('click', function () { pickSlot(i); });
      box.appendChild(b);
    });
  }
  function pickSlot(k) {
    var a = ANIMALS[selected], old = slots[k];
    if (coins < a.price) return;
    coins -= a.price;
    storage.push(old);                                   // the replaced animal goes to the warehouse
    var idx = -1;
    recipe.forEach(function (p, i) { if (p.slot === k) idx = i; });
    var at = null;
    if (idx >= 0) { at = { x: recipe[idx].ox, y: recipe[idx].oy }; recipe.splice(idx, 1); }
    slots[k] = { id: selected };
    finishPurchase(k, at);                               // new poop takes the old one's place
  }
  $('pickCancel').addEventListener('click', function () { showShopMain(); renderShop(); });

  // ---- edit screen: change which animals are in the slots ----
  var editSel = null, editChanged = false;   // editSel: { t: 'slot' | 'store', i }
  function chip(sl, emptyLabel, sel, onClick) {
    var d = document.createElement(onClick ? 'button' : 'div');
    if (sl) {
      var a = ANIMALS[sl.id];
      d.className = 'chip' + (sel ? ' sel' : '');
      d.innerHTML = '<span class="em">' + a.emoji + '</span><span>' + a.name + '</span>';
    } else {
      d.className = 'chip empty' + (sel ? ' sel' : ''); d.textContent = emptyLabel;
    }
    if (onClick) d.addEventListener('click', onClick);
    return d;
  }
  function renderEdit() {
    var set = $('editSet'), store = $('editStore');
    set.innerHTML = ''; store.innerHTML = '';
    slots.forEach(function (sl, i) {
      set.appendChild(chip(sl, '空', editSel && editSel.t === 'slot' && editSel.i === i, function () { tapSlot(i); }));
    });
    if (!storage.length) store.appendChild(chip(null, 'なし', false, null));
    storage.forEach(function (sl, j) {
      store.appendChild(chip(sl, '', editSel && editSel.t === 'store' && editSel.i === j, function () { tapStore(j); }));
    });
    var count = slots.filter(Boolean).length;
    $('unsetBtn').disabled = !(editSel && editSel.t === 'slot' && slots[editSel.i] && count > 1);
  }
  function partIndex(k) { var idx = -1; recipe.forEach(function (p, i) { if (p.slot === k) idx = i; }); return idx; }
  function tapSlot(i) {
    if (editSel && editSel.t === 'store') { placeFromStore(editSel.i, i); return; }
    editSel = (editSel && editSel.t === 'slot' && editSel.i === i) ? null : { t: 'slot', i: i };
    renderEdit();
  }
  function tapStore(j) {
    if (editSel && editSel.t === 'slot') { placeFromStore(j, editSel.i); return; }
    editSel = (editSel && editSel.t === 'store' && editSel.i === j) ? null : { t: 'store', i: j };
    renderEdit();
  }
  function placeFromStore(j, i) {
    var animal = storage.splice(j, 1)[0], old = slots[i], at = null, idx = partIndex(i);
    if (old) storage.push(old);                      // the animal that was there goes to the warehouse
    if (idx >= 0) { at = { x: recipe[idx].ox, y: recipe[idx].oy }; recipe.splice(idx, 1); }
    slots[i] = animal;
    addPart(animal.id, i, at);
    editSel = null; editChanged = true;
    renderSlots(); renderEdit();
  }
  $('unsetBtn').addEventListener('click', function () {
    if (!editSel || editSel.t !== 'slot' || !slots[editSel.i] || slots.filter(Boolean).length <= 1) return;
    var i = editSel.i, idx = partIndex(i);
    storage.push(slots[i]); slots[i] = null;
    if (idx >= 0) recipe.splice(idx, 1);
    synthSel = Math.max(0, Math.min(synthSel, recipe.length - 1));
    editSel = null; editChanged = true;
    renderSlots(); renderEdit();
  });
  $('editBtn').addEventListener('click', function () {
    paused = true; editSel = null; editChanged = false; renderEdit(); editEl.classList.remove('hidden');
  });
  $('closeEdit').addEventListener('click', function () {
    paused = false; editEl.classList.add('hidden');
    if (editChanged) { editChanged = false; openSynth(); }   // slots changed -> synthesis screen
  });
  $('synthBtn').addEventListener('click', function () { openSynth(); });

  shopBtn.addEventListener('click', openShop);
  $('closeShop').addEventListener('click', closeShop);
  $('buy').addEventListener('click', buy);

  // ---- shapes (shared by the lake and the synthesis screen) ----
  function ell(c, x, y, rx, ry, color) {
    c.fillStyle = color;
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
  }
  function drawShape(c, shape, x, y, r, rot) {
    c.save(); c.translate(x, y); c.rotate(rot || 0);
    if (shape === 'swirl') {
      ell(c, 0, r * 0.55, r * 1.0, r * 0.45, '#6b3f16');
      ell(c, 0, r * 0.1, r * 0.78, r * 0.4, '#7b4a1e');
      ell(c, 0, -r * 0.35, r * 0.55, r * 0.35, '#8a5626');
      ell(c, r * 0.05, -r * 0.75, r * 0.25, r * 0.25, '#98622e');
    } else if (shape === 'pie') {
      ell(c, 0, r * 0.15, r * 1.25, r * 0.65, '#5f4120');
      ell(c, -r * 0.25, -r * 0.05, r * 0.5, r * 0.22, 'rgba(255,255,255,0.18)');
    } else {
      ell(c, 0, 0, r, r, '#7b4a1e');
      ell(c, -r * 0.3, -r * 0.3, r * 0.25, r * 0.25, 'rgba(255,255,255,0.25)');
    }
    c.restore();
  }

  // ---- synthesis screen ----
  function addPart(id, slot, at) {
    var a = ANIMALS[id], r = a.r, cx = 0, cy = 0, i;
    if (recipe.length) {
      for (i = 0; i < recipe.length; i++) { cx += recipe[i].ox; cy += recipe[i].oy; }
      cx /= recipe.length; cy /= recipe.length;
    }
    var lim = 0.1, best = { x: 0, y: 0 }, bestD = 1e9;
    for (var gx = -lim; gx <= lim + 1e-9; gx += 0.01) {
      for (var gy = -lim; gy <= lim + 1e-9; gy += 0.01) {
        var ok = recipe.every(function (p) { return Math.hypot(gx - p.ox, gy - p.oy) >= p.r + r; });
        var d = Math.hypot(gx - cx, gy - cy);
        if (ok && d < bestD) { bestD = d; best = { x: gx, y: gy }; }
      }
    }
    if (at) best = at;
    recipe.push({ shape: a.shape, r: r, ox: best.x, oy: best.y, rot: 0, life: a.life, slot: slot });
    synthSel = recipe.length - 1;
  }

  // ---- connectivity: every poop must touch another one ----
  var SHAPE_ELL = {   // ellipses [x, y, rx, ry] in units of the part radius
    round: [[0, 0, 1, 1]],
    swirl: [[0, 0.55, 1, 0.45], [0, 0.1, 0.78, 0.4], [0, -0.35, 0.55, 0.35], [0.05, -0.75, 0.25, 0.25]],
    pie:   [[0, 0.15, 1.25, 0.65]]
  };
  var TOUCH_TOL = 0.004;  // small gap still counts as touching
  function inside(p, x, y, grow) {
    var dx = x - p.ox, dy = y - p.oy, c = Math.cos(p.rot), sn = Math.sin(p.rot);
    var lx = (dx * c + dy * sn) / p.r, ly = (-dx * sn + dy * c) / p.r, g = grow / p.r;
    var E = SHAPE_ELL[p.shape];
    for (var i = 0; i < E.length; i++) {
      var ex = (lx - E[i][0]) / (E[i][2] + g), ey = (ly - E[i][1]) / (E[i][3] + g);
      if (ex * ex + ey * ey <= 1) return true;
    }
    return false;
  }
  function touching(a, b, tol) {
    if (tol === undefined) tol = TOUCH_TOL;
    if (Math.hypot(a.ox - b.ox, a.oy - b.oy) > (a.r + b.r) * 1.6 + tol) return false;
    var st = a.r / 10, ext = a.r * 1.3;
    for (var x = a.ox - ext; x <= a.ox + ext; x += st)
      for (var y = a.oy - ext; y <= a.oy + ext; y += st)
        if (inside(a, x, y, 0) && inside(b, x, y, tol)) return true;
    return false;
  }
  function allConnected() {
    if (recipe.length <= 1) return true;
    var seen = [0], q = [0];
    while (q.length) {
      var i = q.pop();
      for (var j = 0; j < recipe.length; j++)
        if (seen.indexOf(j) < 0 && touching(recipe[i], recipe[j])) { seen.push(j); q.push(j); }
    }
    return seen.length === recipe.length;
  }

  function synthScale() { return W * SYNTH_ZOOM; }
  function drawSynth() {
    var S = synthScale(), c = synthCss / 2;
    var g = sctx.createLinearGradient(0, 0, 0, synthCss);
    g.addColorStop(0, '#d9f0ff'); g.addColorStop(1, '#8fcdf0');
    sctx.fillStyle = g; sctx.fillRect(0, 0, synthCss, synthCss);
    for (var i = 0; i < recipe.length; i++) {
      var p = recipe[i];
      drawShape(sctx, p.shape, c + p.ox * S, c + p.oy * S, p.r * S, p.rot);
    }
    var s = recipe[synthSel];
    if (s) {
      sctx.strokeStyle = '#f59e0b'; sctx.lineWidth = 3; sctx.setLineDash([6, 5]);
      sctx.beginPath(); sctx.arc(c + s.ox * S, c + s.oy * S, s.r * S * 1.3, 0, Math.PI * 2); sctx.stroke();
      sctx.setLineDash([]);
    }
    var ok = allConnected();
    $('synthDone').disabled = !ok;
    $('synthMsg').textContent = ok ? '' : 'くっついていないうんちがあります';
  }
  // zoom: "－" shows a wider area, "＋" zooms back in (never so far that a poop leaves the view)
  function maxZoom() {
    var m = 0.001;
    recipe.forEach(function (p) { m = Math.max(m, Math.abs(p.ox) + p.r * 1.3, Math.abs(p.oy) + p.r * 1.3); });
    return Math.max(1, Math.min(3, synthCss / 2 / W / m));
  }
  function setZoom(z) { SYNTH_ZOOM = Math.max(1, Math.min(z, maxZoom())); drawSynth(); }

  function openSynth() {
    paused = true;
    synthEl.classList.remove('hidden');
    synthCss = synthCanvas.clientWidth;
    synthCanvas.width = synthCss * dpr; synthCanvas.height = synthCss * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SYNTH_ZOOM = Math.min(SYNTH_ZOOM, maxZoom());
    drawSynth();
  }
  function closeSynth() {
    if (!allConnected()) return; synthEl.classList.add('hidden'); paused = false; }

  var drag = null;
  function synthPoint(e) {
    var rc = synthCanvas.getBoundingClientRect();
    return { x: (e.clientX - rc.left) * synthCss / rc.width, y: (e.clientY - rc.top) * synthCss / rc.width };
  }
  synthCanvas.addEventListener('pointerdown', function (e) {
    var pt = synthPoint(e), S = synthScale(), c = synthCss / 2;
    for (var i = recipe.length - 1; i >= 0; i--) {
      var p = recipe[i];
      if (Math.hypot(pt.x - (c + p.ox * S), pt.y - (c + p.oy * S)) <= p.r * S * 1.3) {
        synthSel = i;
        drag = { i: i, dx: pt.x - (c + p.ox * S), dy: pt.y - (c + p.oy * S) };
        synthCanvas.setPointerCapture(e.pointerId);
        break;
      }
    }
    drawSynth();
  });
  synthCanvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var pt = synthPoint(e), S = synthScale(), c = synthCss / 2, p = recipe[drag.i];
    var lim = c / S - p.r;
    p.ox = Math.max(-lim, Math.min(lim, (pt.x - drag.dx - c) / S));
    p.oy = Math.max(-lim, Math.min(lim, (pt.y - drag.dy - c) / S));
    drawSynth();
  });
  function endDrag() { drag = null; }
  synthCanvas.addEventListener('pointerup', endDrag);
  synthCanvas.addEventListener('pointercancel', endDrag);
  // tap = one step, hold = keeps repeating
  function holdRepeat(btn, fn) {
    var t1 = null, t2 = null;
    function stop() { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault(); stop(); fn();
      t1 = setTimeout(function () { t2 = setInterval(fn, 80); }, 350);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, stop); });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  function rotateSel(d) { if (recipe[synthSel]) { recipe[synthSel].rot += d; drawSynth(); } }
  holdRepeat($('rotL'), function () { rotateSel(-Math.PI / 12); });
  holdRepeat($('rotR'), function () { rotateSel(Math.PI / 12); });
  holdRepeat($('zoomOut'), function () { setZoom(SYNTH_ZOOM / 1.25); });
  holdRepeat($('zoomIn'), function () { setZoom(SYNTH_ZOOM * 1.25); });
  $('synthDone').addEventListener('click', closeSynth);

  // ---- game start ----
  function startPlay() {
    try { screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
    titleEl.classList.add('hidden');
    canvas.classList.remove('hidden');
    shopBtn.classList.remove('hidden');
    bottomEl.classList.remove('hidden');
    coinHud.classList.remove('hidden');
    incomeT = 0; floaters = [];
    dragging = null; ballFalling = false;
    ball.x = 0;
    resize();
    ball.x = W / 2;
    ball.y = H * 0.5 - ball.r * 3;
    ball.vx = 0; ball.vy = 0;
    poops = []; spawnT = 0;
    slots = [{ id: 'rabbit' }, null, null, null, null];
    storage = [];
    recipe = [{ shape: 'round', r: ANIMALS.rabbit.r, ox: 0, oy: 0, rot: 0, life: ANIMALS.rabbit.life, slot: 0 }];
    renderSlots(); updateCoins();
    paused = false;
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }
  $('play').addEventListener('click', startPlay);

  // ---- drag the red ball ----
  function canvasPoint(e) {
    var rc = canvas.getBoundingClientRect();
    return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height };
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (!running || paused || dragging) return;
    var pt = canvasPoint(e);
    if (Math.hypot(pt.x - ball.x, pt.y - ball.y) > ball.r * 1.8) return;
    dragging = { dx: pt.x - ball.x, dy: pt.y - ball.y };
    ball.vx = 0; ball.vy = 0; ball.w = 0;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var pt = canvasPoint(e);
    ball.x = Math.max(ball.r, Math.min(W - ball.r, pt.x - dragging.dx));
    ball.y = Math.max(ball.r, Math.min(H - ball.r, pt.y - dragging.dy));
  });
  function releaseBall() {
    if (!dragging) return;
    dragging = null;
    ballFalling = true;   // no income until it has landed
  }
  canvas.addEventListener('pointerup', releaseBall);
  canvas.addEventListener('pointercancel', releaseBall);

  // ---- the finished poop floats up from the bottom, at a random x ----
  // Each poop is a rigid body: it moves AND rotates (buoyancy acts on every part, so uneven submersion makes torque).
  function spawnComposite() {
    var i, p, wsum = 0, cx = 0, cy = 0;
    for (i = 0; i < recipe.length; i++) { p = recipe[i]; wsum += p.r * p.r; cx += p.ox * p.r * p.r; cy += p.oy * p.r * p.r; }
    cx /= wsum; cy /= wsum;
    var parts = [], R = 0;
    for (i = 0; i < recipe.length; i++) {
      p = recipe[i];
      var q = { ox: (p.ox - cx) * W, oy: (p.oy - cy) * W, r: p.r * W, shape: p.shape, rot: p.rot, age: 0, life: p.life };
      parts.push(q);
      R = Math.max(R, Math.hypot(q.ox, q.oy) + q.r);
    }
    poops.push(makeBody(parts, R + Math.random() * (W - 2 * R), H + R, 0, 0, 0, 0));
  }

  // a rigid body made of parts (ox/oy are relative to the body's centre of mass, in the body's own frame)
  function makeBody(parts, x, y, th, vx, vy, w) {
    var w0 = Math.pow(0.05 * W, 2), mass = 0, inertia = 0, R = 0;
    parts.forEach(function (q) {
      var wt = q.r * q.r / w0;
      mass += wt;
      inertia += wt * (q.ox * q.ox + q.oy * q.oy + q.r * q.r / 2);
      R = Math.max(R, Math.hypot(q.ox, q.oy) + q.r);
    });
    var body = { x: x, y: y, vx: vx, vy: vy, th: th, w: w, eq: 0.45, m: mass, invI: 1 / inertia, w0: w0, parts: parts, R: R };
    updWorld(body);
    return body;
  }

  // after some parts broke: the rest may fall apart into several separate poops
  function splitBody(b, alive) {
    var c = Math.cos(b.th), sn = Math.sin(b.th), tol = TOUCH_TOL * W;
    var wp = alive.map(function (p) {
      return { ox: b.x + p.wx, oy: b.y + p.wy, r: p.r, shape: p.shape, rot: p.rot + b.th, ref: p };
    });
    var done = [], out = [];
    for (var s0 = 0; s0 < wp.length; s0++) {
      if (done.indexOf(s0) >= 0) continue;
      var comp = [s0], stack = [s0]; done.push(s0);
      while (stack.length) {
        var i = stack.pop();
        for (var j = 0; j < wp.length; j++)
          if (done.indexOf(j) < 0 && touching(wp[i], wp[j], tol)) { done.push(j); comp.push(j); stack.push(j); }
      }
      var sw = 0, cx = 0, cy = 0;
      comp.forEach(function (k) { var w = wp[k].r * wp[k].r; sw += w; cx += wp[k].ox * w; cy += wp[k].oy * w; });
      cx /= sw; cy /= sw;
      var parts = comp.map(function (k) {
        var p = wp[k].ref, dx = wp[k].ox - cx, dy = wp[k].oy - cy;
        p.ox = dx * c + dy * sn; p.oy = -dx * sn + dy * c;
        return p;
      });
      var rx = cx - b.x, ry = cy - b.y;
      out.push(makeBody(parts, cx, cy, b.th, b.vx - b.w * ry, b.vy + b.w * rx, b.w));
    }
    return out;
  }

  function updWorld(b) {
    var c = Math.cos(b.th), sn = Math.sin(b.th);
    for (var i = 0; i < b.parts.length; i++) {
      var p = b.parts[i];
      p.wx = p.ox * c - p.oy * sn; p.wy = p.ox * sn + p.oy * c;
    }
  }

  function integrate(b, dt) {
    var waterY = H * 0.5, S = 0, tot = 0, torque = 0, i, p;
    for (i = 0; i < b.parts.length; i++) {
      p = b.parts[i];
      var si = Math.max(0, Math.min(1, (b.y + p.wy + p.r - waterY) / (p.r * 2)));
      var wt = p.r * p.r;
      S += si * wt; tot += wt;
      if (b.invI) torque += -(wt / b.w0) * GRAVITY * si / b.eq * p.wx;   // buoyancy at each part
    }
    S /= tot;
    b.vy += GRAVITY * (1 - S / b.eq) * dt;
    var k = 1 - Math.min(1, WATER_DRAG * S * dt);
    b.vx *= k; b.vy *= k;
    if (b.invI) {
      b.w += torque * b.invI * dt;
      b.w *= 1 - Math.min(1, (ANG_DRAG * S + 0.3) * dt);
      b.w = Math.max(-12, Math.min(12, b.w));
      b.th += b.w * dt;
      updWorld(b);
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    var l = 0, r = 0;
    for (i = 0; i < b.parts.length; i++) { p = b.parts[i]; l = Math.max(l, p.r - p.wx); r = Math.max(r, p.r + p.wx); }
    if (b.x - l < 0) { b.x = l; b.vx = Math.abs(b.vx) * 0.3; }
    if (b.x + r > W) { b.x = W - r; b.vx = -Math.abs(b.vx) * 0.3; }
  }

  function collide(a, b) {
    var bx = b.x - a.x, by = b.y - a.y, bm = a.R + b.R;
    if (bx * bx + by * by >= bm * bm) return;
    var ia = 1 / a.m, ib = 1 / b.m, sum = ia + ib;
    for (var i = 0; i < a.parts.length; i++) {
      for (var j = 0; j < b.parts.length; j++) {
        var pa = a.parts[i], pb = b.parts[j];
        var ax = a.x + pa.wx, ay = a.y + pa.wy;
        var dx = (b.x + pb.wx) - ax, dy = (b.y + pb.wy) - ay, min = pa.r + pb.r;
        var d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        if (a === ball || b === ball) ballTouched = true;
        var d = Math.sqrt(d2), nx = 1, ny = 0;
        if (d > 0.0001) { nx = dx / d; ny = dy / d; }
        var push = min - d;
        // contact point and lever arms (before moving the bodies apart)
        var cxp = ax + nx * (pa.r - push / 2), cyp = ay + ny * (pa.r - push / 2);
        var rax = cxp - a.x, ray = cyp - a.y, rbx = cxp - b.x, rby = cyp - b.y;
        a.x -= nx * push * ia / sum; a.y -= ny * push * ia / sum;
        b.x += nx * push * ib / sum; b.y += ny * push * ib / sum;
        var vax = a.vx - a.w * ray, vay = a.vy + a.w * rax;
        var vbx = b.vx - b.w * rby, vby = b.vy + b.w * rbx;
        var vn = (vbx - vax) * nx + (vby - vay) * ny;
        if (vn < 0) {
          var cra = rax * ny - ray * nx, crb = rbx * ny - rby * nx;
          var jj = -(1 + 0.2) * vn / (sum + a.invI * cra * cra + b.invI * crb * crb);
          a.vx -= jj * ia * nx; a.vy -= jj * ia * ny; a.w -= jj * a.invI * cra;
          b.vx += jj * ib * nx; b.vy += jj * ib * ny; b.w += jj * b.invI * crb;
        }
      }
    }
  }

  function step(dt) {
    spawnT += dt;
    if (spawnT >= SPAWN_INTERVAL) { spawnT -= SPAWN_INTERVAL; spawnComposite(); }

    incomeT += dt;
    if (incomeT >= 1) {
      incomeT -= 1;
      var rest = H * 0.5 - ball.r * (1 - 2 * ball.eq);
      var gain = Math.floor((rest - ball.y) / (H * 0.01));
      if (gain > 0 && !dragging && !ballFalling) {   // no income while dragging or falling
        coins += gain; updateCoins();
        floaters.push({ text: '+' + gain, x: ball.x, y: ball.y - ball.r * 1.6, age: 0 });
      }
    }
    for (var f = 0; f < floaters.length; f++) { floaters[f].age += dt; floaters[f].y -= 40 * dt; }
    floaters = floaters.filter(function (o) { return o.age < 1; });

    if (dragging) { ball.vx = 0; ball.vy = 0; } else integrate(ball, dt);
    var i, j;
    for (i = 0; i < poops.length; i++) {
      integrate(poops[i], dt);
      poops[i].parts.forEach(function (q) { q.age += dt; });
    }
    var all = (dragging ? [] : [ball]).concat(poops);   // the held ball passes through poops
    ballTouched = false;
    for (i = 0; i < all.length; i++)
      for (j = i + 1; j < all.length; j++) collide(all[i], all[j]);
    // landed: touched the water or a poop after being released
    if (ballFalling && !dragging && (ballTouched || ball.y + ball.r >= H * 0.5)) ballFalling = false;
    // each part breaks on its own once its lifetime is over (kinds differ)
    var next = [];
    poops.forEach(function (b) {
      var alive = b.parts.filter(function (q) { return q.age < q.life; });
      if (alive.length === b.parts.length) next.push(b);
      else if (alive.length) Array.prototype.push.apply(next, splitBody(b, alive));
    });
    poops = next;
  }

  function draw() {
    var waterY = H * 0.5;
    var sky = ctx.createLinearGradient(0, 0, 0, waterY);
    sky.addColorStop(0, '#9fd8ff'); sky.addColorStop(1, '#e3f4ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, waterY);
    var wg = ctx.createLinearGradient(0, waterY, 0, H);
    wg.addColorStop(0, '#3a9ad9'); wg.addColorStop(1, '#0d4f8b');
    ctx.fillStyle = wg; ctx.fillRect(0, waterY, W, H - waterY);
    var i, k, b, q;
    for (i = 0; i < poops.length; i++) {
      b = poops[i];
      for (k = 0; k < b.parts.length; k++) { q = b.parts[k]; drawShape(ctx, q.shape, b.x + q.wx, b.y + q.wy, q.r, q.rot + b.th); }
    }
    ell(ctx, ball.x, ball.y, ball.r, ball.r, '#e53935');
    ell(ctx, ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.25, ball.r * 0.25, 'rgba(255,255,255,0.35)');
    ctx.fillStyle = 'rgba(30,120,200,0.45)';
    ctx.fillRect(0, waterY, W, H - waterY);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(0, waterY - 1, W, 2);
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.07) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.lineJoin = 'round';
    for (k = 0; k < floaters.length; k++) {
      var o = floaters[k];
      ctx.globalAlpha = Math.max(0, 1 - o.age);
      ctx.strokeStyle = '#7a4a00'; ctx.strokeText(o.text, o.x, o.y);
      ctx.fillStyle = '#ffd43b'; ctx.fillText(o.text, o.x, o.y);
    }
    ctx.globalAlpha = 1;
  }

  var last = 0, acc = 0;
  function loop(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (paused) { acc = 0; } else { acc += dt; }
    var FIXED = 1 / 120;
    while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
    draw();
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
