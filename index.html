<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>湖にうんちを浮かべるゲーム</title>
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; touch-action: none; -webkit-user-select: none; user-select: none; }
  *, *::before, *::after { box-sizing: inherit; }
  #stage {
    position: fixed; left: 50%; top: 0; bottom: 0; transform: translateX(-50%);
    width: min(100vw, 56.25vh); overflow: hidden; background: #bfe6ff;
    container-type: inline-size;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  @supports (height: 100dvh) { #stage { width: min(100vw, 56.25dvh); } }
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: #222; color: #fff; font: bold 20px sans-serif; text-align: center;
  }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(#bfe6ff, #7cc4ee);
    padding-top: calc(env(safe-area-inset-top, 0px) + 24cqw);
  }
  #title h1 {
    margin: 0; padding: 0 6cqw; text-align: center; color: #5a3a1a; word-break: keep-all;
    font-size: 10.5cqw; line-height: 1.35; text-shadow: 0 0.6cqw 0 #fff;
  }
  button { font-family: inherit; }
  #play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 8cqw; font-weight: bold; white-space: nowrap;
    padding: 0.6em 1.8em; border: none; border-radius: 999px;
    color: #fff; background: #e53935; box-shadow: 0 1.4cqw 0 #a02320;
  }
  #play:active { transform: translate(-50%, calc(-50% + 1cqw)); box-shadow: 0 0.4cqw 0 #a02320; }

  #shopBtn {
    position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    font-size: 4.2cqw; font-weight: bold; color: #fff; background: #f59e0b;
    border: none; border-radius: 999px; padding: 0.5em 1.1em; box-shadow: 0 3px 0 #b36f00;
  }
  #shopBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b36f00; }
  #coinHud {
    position: absolute; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    font-size: 4.2cqw; font-weight: bold; color: #5a3a1a; background: rgba(255, 248, 232, 0.9);
    border-radius: 999px; padding: 0.5em 1.1em;
  }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; }
  #slotBar { display: flex; gap: 2cqw; padding: 0 2cqw 1.5cqw; }
  .pill {
    font-size: 4cqw; font-weight: bold; color: #fff; background: #2f80c0; border: none;
    border-radius: 999px; padding: 0.4em 1.2em; box-shadow: 0 3px 0 #1f5b8c;
  }
  .pill:active { transform: translateY(2px); box-shadow: 0 1px 0 #1f5b8c; }
  #maxHud {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 10px + 11cqw);
    font-size: 4cqw; font-weight: bold; color: #5a3a1a; background: rgba(255, 248, 232, 0.9);
    border-radius: 999px; padding: 0.4em 1.1em; white-space: nowrap;
  }
  #slots {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 2cqw;
    padding: 2cqw 2cqw calc(2cqw + env(safe-area-inset-bottom, 0px));
  }
  .slot {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 9cqw; line-height: 1; border-radius: 14%;
    background: rgba(8, 40, 80, 0.88); border: 2px solid rgba(255, 255, 255, 0.45);
  }
  .slot.empty { background: rgba(8, 40, 80, 0.55); border-style: dashed; border-color: rgba(255, 255, 255, 0.3); }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55); padding: 0 6cqw;
  }
  .card {
    width: 100%; background: #fff8e8; color: #5a3a1a; border-radius: 4cqw; padding: 4cqw;
    font-size: 4.4cqw;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3cqw; font-weight: bold; }
  .head .t { font-size: 6cqw; }
  #closeShop, #closeEdit { border: none; background: #ddd0b4; color: #5a3a1a; border-radius: 50%; width: 9cqw; height: 9cqw; font-size: 5cqw; }
  .item {
    display: flex; align-items: center; gap: 3cqw; width: 100%; margin-bottom: 2cqw; text-align: left;
    background: #fff; color: inherit; border: 3px solid #e8dcc0; border-radius: 3cqw; padding: 2cqw 3cqw;
    font-size: inherit;
  }
  .item.sel { border-color: #f59e0b; background: #fff3d1; }
  .item .em { font-size: 10cqw; line-height: 1; }
  .item .nm { flex: 1; font-weight: bold; }
  .item .nm small { display: block; font-weight: normal; font-size: 3.6cqw; opacity: 0.75; }
  .item .pr { font-weight: bold; }
  .bigbtn {
    width: 100%; border: none; border-radius: 999px; padding: 0.6em; margin-top: 1cqw;
    font-size: 5cqw; font-weight: bold; color: #fff; background: #e53935; box-shadow: 0 4px 0 #a02320;
  }
  .bigbtn:disabled { background: #bbb; box-shadow: 0 4px 0 #888; }
  #msg { min-height: 1.4em; margin-top: 2cqw; text-align: center; font-size: 4cqw; }

  #synthHint { font-size: 3.6cqw; opacity: 0.8; margin-bottom: 2cqw; }
  #synthCanvas {
    display: block; width: 100%; aspect-ratio: 1; border-radius: 3cqw; touch-action: none;
    border: 3px solid #e8dcc0;
  }
  #synthMsg { min-height: 1.4em; margin-top: 2cqw; text-align: center; font-size: 3.8cqw; color: #c62828; font-weight: bold; }
  #synthBtns { display: flex; gap: 3cqw; margin-top: 3cqw; }
  #synthBtns button {
    flex: 1; border: none; border-radius: 3cqw; padding: 0.4em; font-size: 7cqw; font-weight: bold;
    background: #ddd0b4; color: #5a3a1a; box-shadow: 0 3px 0 #b9a984;
  }
  #synthBtns button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b9a984; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2cqw; margin-bottom: 3cqw; }
  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5cqw;
    min-height: 15cqw; padding: 1.5cqw 0; font-size: 3cqw; font-weight: bold; color: inherit;
    background: #fff; border: 3px solid #e8dcc0; border-radius: 2.5cqw;
  }
  .chip .em { font-size: 7cqw; line-height: 1; }
  .chip.sel { border-color: #f59e0b; background: #fff3d1; }
  #editHint { font-size: 3.6cqw; opacity: 0.8; margin-bottom: 2cqw; }
  .chip.empty { opacity: 0.55; border-style: dashed; }
  button.chip:active { background: #fff3d1; border-color: #f59e0b; }
  .sec { font-weight: bold; margin: 1cqw 0 2cqw; }
  #edit .card { max-height: 90%; overflow: auto; }
  #pickTitle { font-weight: bold; margin-bottom: 3cqw; }
  #pickCancel { background: #9aa4ad; box-shadow: 0 4px 0 #6f7983; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" class="hidden"></canvas>
  <div id="title">
    <h1>湖にうんちを<br>浮かべるゲーム</h1>
    <button id="play">プレイ</button>
  </div>
  <button id="shopBtn" class="hidden">ショップ</button>
  <div id="coinHud" class="hidden"></div>
  <div id="maxHud" class="hidden"></div>
  <div id="bottom" class="hidden">
    <div id="slotBar"><button id="editBtn" class="pill">編集</button><button id="synthBtn" class="pill">合成</button></div>
    <div id="slots"></div>
  </div>
  <div id="result" class="overlay hidden">
    <div class="card" style="text-align:center">
      <div class="head"><span class="t">結果</span></div>
      <div id="resText" style="font-size:6cqw;line-height:1.6;margin-bottom:3cqw"></div>
      <button id="resNext" class="bigbtn">次のうんちへ</button>
      <button id="resShop" class="bigbtn" style="background:#f59e0b;box-shadow:0 4px 0 #b36f00">ショップ</button>
      <button id="resEdit" class="bigbtn" style="background:#2f80c0;box-shadow:0 4px 0 #1f5b8c">編集・合成</button>
    </div>
  </div>
  <div id="shop" class="overlay hidden">
    <div class="card">
      <div class="head"><span class="t">ショップ</span><span id="coins"></span><button id="closeShop">✕</button></div>
      <div id="items"></div>
      <button id="buy" class="bigbtn" disabled>買う</button>
      <div id="pick" class="hidden">
        <div id="pickTitle">どのスロットと入れ替える?(外した動物は倉庫へ)</div>
        <div id="pickSlots" class="grid"></div>
        <button id="pickCancel" class="bigbtn">やめる</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="edit" class="overlay hidden">
    <div class="card">
      <div class="head"><span class="t">編集</span><button id="closeEdit">✕</button></div>
      <div id="editHint">タップで選んで、スロットと倉庫の動物を入れ替えられます</div>
      <div class="sec">セット中</div>
      <div id="editSet" class="grid"></div>
      <div class="sec">倉庫</div>
      <div id="editStore" class="grid"></div>
      <button id="unsetBtn" class="bigbtn" disabled>選んだ動物を倉庫に戻す</button>
    </div>
  </div>
  <div id="synth" class="overlay hidden">
    <div class="card">
      <div class="head"><span class="t">合成</span></div>
      <div id="synthHint">ドラッグで動かして、ボタンで回転・拡大縮小しながら組み合わせよう</div>
      <canvas id="synthCanvas"></canvas>
      <div id="synthBtns"><button id="rotL">↺</button><button id="rotR">↻</button><button id="zoomOut">－</button><button id="zoomIn">＋</button></div>
      <div id="synthMsg"></div>
      <button id="synthDone" class="bigbtn">完成</button>
    </div>
  </div>
</div>
<div id="rotate">スマホを縦向きにしてください</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stageEl = $('stage'), titleEl = $('title'), canvas = $('game'), ctx = canvas.getContext('2d');
  var coinHud = $('coinHud'), slotsEl = $('slots'), bottomEl = $('bottom'), editEl = $('edit'), shopEl = $('shop'), shopBtn = $('shopBtn');
  var synthEl = $('synth'), synthCanvas = $('synthCanvas'), sctx = synthCanvas.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var running = false, paused = false;

  // ---- animals: each one has a different poop shape ----
  var ANIMALS = {
    rabbit: { emoji: '🐰', name: 'うさぎ', shape: 'round', desc: 'まるいうんち', price: 100, r: 0.05, life: 30 },
    dog:    { emoji: '🐶', name: 'いぬ',   shape: 'swirl', desc: 'とぐろのうんち', price: 200, r: 0.055, life: 45 },
    cow:    { emoji: '🐮', name: 'うし',   shape: 'pie',   desc: 'ぺちゃんこうんち', price: 300, r: 0.055, life: 20 }
  };
  var SLOT_COUNT = 5;
  var slots = [];   // { id } or null
  var storage = []; // owned animals that are not set in a slot (倉庫)
  var picking = false;
  var shopChanged = false;   // something was bought since the shop was opened
  var coins = 1000;
  var selected = null;
  var incomeT = 0;
  var maxHm = 0;   // highest height (m) among the moments income was received
  var floaters = [];

  // ---- explosions ----
  var sparks = [], rings = [], chunks = [], ripples = [];
  var pile = [], hm = [];   // settled chunks on the lake bottom, and the pile height per column
  function resetPile() { pile = []; hm = []; for (var i = 0; i < 48; i++) hm.push(0); }
  resetPile();
  function addRipple(x, amp) { ripples.push({ x: x, amp: amp, age: 0 }); if (ripples.length > 6) ripples.shift(); }
  var shakeT = 0, shakeA = 0;
  var blastFly = null;   // { top, up } while the ball is flying after an explosion
  var camY = 0;          // world y of the screen's top edge (0 = normal view, negative = camera moved up)
  var actx = null, lastBoom = 0;
  var BLAST_COLORS = ['#ff6b81', '#ffd43b', '#7cf0ff', '#b388ff', '#69f0ae'];

  // ---- recipe: the poops placed together on the synthesis screen ----
  // each part: { shape, r, ox, oy, rot }  (lengths in units of stage width)
  var recipe = [];
  var synthSel = 0;
  var SYNTH_ZOOM = 2.5;
  var synthCss = 0;

  // ---- physics ----
  var GRAVITY = 1200, WATER_DRAG = 2.5, ANG_DRAG = 6;
  var poops = [], roundOn = false;
  var resultEl = $('result');
  function anyOverlay() { return [shopEl, editEl, synthEl, resultEl].some(function (e) { return !e.classList.contains('hidden'); }); }
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = stageEl.clientWidth; H = stageEl.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---- slots UI ----
  function renderSlots() {
    slotsEl.innerHTML = '';
    for (var i = 0; i < SLOT_COUNT; i++) {
      var d = document.createElement('div');
      d.className = 'slot' + (slots[i] ? '' : ' empty');
      d.textContent = slots[i] ? ANIMALS[slots[i].id].emoji : '';
      slotsEl.appendChild(d);
    }
  }

  function updateMax() {
    var n = 0; poops.forEach(function (b) { n += b.parts.length; });
    $('maxHud').textContent = '最高高度 ' + maxHm.toFixed(2) + 'm　残り ' + n + 'こ';
  }
  function updateCoins() {
    $('coins').textContent = '💰 ' + coins;
    coinHud.textContent = '💰 ' + coins;
  }

  // ---- shop UI ----
  function renderShop() {
    updateCoins();
    var box = $('items'); box.innerHTML = '';
    Object.keys(ANIMALS).forEach(function (id) {
      var a = ANIMALS[id];
      var b = document.createElement('button');
      b.className = 'item' + (selected === id ? ' sel' : '');
      b.innerHTML = '<span class="em">' + a.emoji + '</span><span class="nm">' + a.name +
        '<small>' + a.desc + '・爆発力 ' + '💥'.repeat(Math.round(a.price / 100)) + '</small></span><span class="pr">💰 ' + a.price + '</span>';
      b.addEventListener('click', function () { selected = id; $('msg').textContent = ''; renderShop(); });
      box.appendChild(b);
    });
    $('buy').disabled = !selected;
  }
  function showShopMain() {
    picking = false;
    $('items').classList.remove('hidden'); $('buy').classList.remove('hidden'); $('pick').classList.add('hidden');
  }
  function openShop() { paused = true; shopChanged = false; $('msg').textContent = ''; showShopMain(); renderShop(); shopEl.classList.remove('hidden'); }
  function closeShop() {
    shopEl.classList.add('hidden'); paused = anyOverlay();
    if (shopChanged) { shopChanged = false; openSynth(); }
  }
  function finishPurchase(k, at) {
    renderSlots(); updateCoins();
    addPart(selected, k, at);
    shopChanged = true;                // the synthesis screen opens when the shop is closed
    showShopMain(); renderShop();
    $('msg').textContent = ANIMALS[selected].name + 'を買いました!';
  }
  function buy() {
    if (!selected) return;
    var a = ANIMALS[selected], free = slots.indexOf(null);
    if (coins < a.price) { $('msg').textContent = 'コインが足りません'; return; }
    if (free < 0) { startPick(); return; }   // slots are full: choose which one to replace
    coins -= a.price;
    slots[free] = { id: selected };
    finishPurchase(free, null);
  }
  function startPick() {
    picking = true;
    $('items').classList.add('hidden'); $('buy').classList.add('hidden'); $('pick').classList.remove('hidden');
    $('msg').textContent = '';
    var box = $('pickSlots'); box.innerHTML = '';
    slots.forEach(function (sl, i) {
      var a = ANIMALS[sl.id], b = document.createElement('button');
      b.className = 'chip';
      b.innerHTML = '<span class="em">' + a.emoji + '</span><span>' + a.name + '</span>';
      b.addEventListener('click', function () { pickSlot(i); });
      box.appendChild(b);
    });
  }
  function pickSlot(k) {
    var a = ANIMALS[selected], old = slots[k];
    if (coins < a.price) return;
    coins -= a.price;
    storage.push(old);                                   // the replaced animal goes to the warehouse
    var idx = -1;
    recipe.forEach(function (p, i) { if (p.slot === k) idx = i; });
    var at = null;
    if (idx >= 0) { at = { x: recipe[idx].ox, y: recipe[idx].oy }; recipe.splice(idx, 1); }
    slots[k] = { id: selected };
    finishPurchase(k, at);                               // new poop takes the old one's place
  }
  $('pickCancel').addEventListener('click', function () { showShopMain(); renderShop(); });

  // ---- edit screen: change which animals are in the slots ----
  var editSel = null, editChanged = false;   // editSel: { t: 'slot' | 'store', i }
  function chip(sl, emptyLabel, sel, onClick) {
    var d = document.createElement(onClick ? 'button' : 'div');
    if (sl) {
      var a = ANIMALS[sl.id];
      d.className = 'chip' + (sel ? ' sel' : '');
      d.innerHTML = '<span class="em">' + a.emoji + '</span><span>' + a.name + '</span>';
    } else {
      d.className = 'chip empty' + (sel ? ' sel' : ''); d.textContent = emptyLabel;
    }
    if (onClick) d.addEventListener('click', onClick);
    return d;
  }
  function renderEdit() {
    var set = $('editSet'), store = $('editStore');
    set.innerHTML = ''; store.innerHTML = '';
    slots.forEach(function (sl, i) {
      set.appendChild(chip(sl, '空', editSel && editSel.t === 'slot' && editSel.i === i, function () { tapSlot(i); }));
    });
    if (!storage.length) store.appendChild(chip(null, 'なし', false, null));
    storage.forEach(function (sl, j) {
      store.appendChild(chip(sl, '', editSel && editSel.t === 'store' && editSel.i === j, function () { tapStore(j); }));
    });
    var count = slots.filter(Boolean).length;
    $('unsetBtn').disabled = !(editSel && editSel.t === 'slot' && slots[editSel.i] && count > 1);
  }
  function partIndex(k) { var idx = -1; recipe.forEach(function (p, i) { if (p.slot === k) idx = i; }); return idx; }
  function tapSlot(i) {
    if (editSel && editSel.t === 'store') { placeFromStore(editSel.i, i); return; }
    editSel = (editSel && editSel.t === 'slot' && editSel.i === i) ? null : { t: 'slot', i: i };
    renderEdit();
  }
  function tapStore(j) {
    if (editSel && editSel.t === 'slot') { placeFromStore(j, editSel.i); return; }
    editSel = (editSel && editSel.t === 'store' && editSel.i === j) ? null : { t: 'store', i: j };
    renderEdit();
  }
  function placeFromStore(j, i) {
    var animal = storage.splice(j, 1)[0], old = slots[i], at = null, idx = partIndex(i);
    if (old) storage.push(old);                      // the animal that was there goes to the warehouse
    if (idx >= 0) { at = { x: recipe[idx].ox, y: recipe[idx].oy }; recipe.splice(idx, 1); }
    slots[i] = animal;
    addPart(animal.id, i, at);
    editSel = null; editChanged = true;
    renderSlots(); renderEdit();
  }
  $('unsetBtn').addEventListener('click', function () {
    if (!editSel || editSel.t !== 'slot' || !slots[editSel.i] || slots.filter(Boolean).length <= 1) return;
    var i = editSel.i, idx = partIndex(i);
    storage.push(slots[i]); slots[i] = null;
    if (idx >= 0) recipe.splice(idx, 1);
    synthSel = Math.max(0, Math.min(synthSel, recipe.length - 1));
    editSel = null; editChanged = true;
    renderSlots(); renderEdit();
  });
  $('editBtn').addEventListener('click', function () {
    paused = true; editSel = null; editChanged = false; renderEdit(); editEl.classList.remove('hidden');
  });
  $('closeEdit').addEventListener('click', function () {
    editEl.classList.add('hidden'); paused = anyOverlay();
    if (editChanged) { editChanged = false; openSynth(); }   // slots changed -> synthesis screen
  });
  $('synthBtn').addEventListener('click', function () { openSynth(); });

  shopBtn.addEventListener('click', openShop);
  $('closeShop').addEventListener('click', closeShop);
  $('buy').addEventListener('click', buy);

  // ---- shapes (shared by the lake and the synthesis screen) ----
  function ell(c, x, y, rx, ry, color) {
    c.fillStyle = color;
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
  }
  function drawShape(c, shape, x, y, r, rot) {
    c.save(); c.translate(x, y); c.rotate(rot || 0);
    if (shape === 'swirl') {
      ell(c, 0, r * 0.55, r * 1.0, r * 0.45, '#6b3f16');
      ell(c, 0, r * 0.1, r * 0.78, r * 0.4, '#7b4a1e');
      ell(c, 0, -r * 0.35, r * 0.55, r * 0.35, '#8a5626');
      ell(c, r * 0.05, -r * 0.75, r * 0.25, r * 0.25, '#98622e');
    } else if (shape === 'pie') {
      ell(c, 0, r * 0.15, r * 1.25, r * 0.65, '#5f4120');
      ell(c, -r * 0.25, -r * 0.05, r * 0.5, r * 0.22, 'rgba(255,255,255,0.18)');
    } else {
      ell(c, 0, 0, r, r, '#7b4a1e');
      ell(c, -r * 0.3, -r * 0.3, r * 0.25, r * 0.25, 'rgba(255,255,255,0.25)');
    }
    c.restore();
  }

  // ---- synthesis screen ----
  function addPart(id, slot, at) {
    var a = ANIMALS[id], r = a.r, cx = 0, cy = 0, i;
    if (recipe.length) {
      for (i = 0; i < recipe.length; i++) { cx += recipe[i].ox; cy += recipe[i].oy; }
      cx /= recipe.length; cy /= recipe.length;
    }
    var lim = 0.1, best = { x: 0, y: 0 }, bestD = 1e9;

  // a rigid body made of parts (ox/oy are relative to the body's centre of mass, in the body's own frame)

  // ---- explosion: a poop bursts like a firework shell when its life ends ----

        var f = f0 * (1.5 - 0.7 * tt) * (1 + jit);          // pitch sags as it goes

      s.vx *= k; s.vy = s.vy * k + 500 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
    sparks = sparks.filter(function (o) { return o.age < o.life; });
    for (i = 0; i < chunks.length; i++) {
      s = chunks[i]; s.age += dt;
      var inW = s.y > H * 0.08, kc = Math.exp(-(inW ? 3.5 : 0.6) * dt);
      s.vx *= kc; s.vy = s.vy * kc + (inW ? 600 : 2200) * dt;   // heavy: falls fast in air, sinks slowly in water
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
      var bi = Math.max(0, Math.min(47, Math.floor(s.x / W * 48))), fy = H * 0.78 - hm[bi];
      if (s.y + s.size * 0.5 >= fy) {   // landed: it stays and piles up
        s.dead = true;
        pile.push({ x: Math.max(0, Math.min(W, s.x)), y: fy - s.size * 0.4 + (Math.random() - 0.5) * s.size * 0.3, rot: s.rot, size: s.size, col: s.col });
        hm[bi] = Math.min(W * 0.15, hm[bi] + s.size * 0.7);
        if (pile.length > 500) pile.shift();
      }
    }
    chunks = chunks.filter(function (o) { return !o.dead; });
    for (i = 0; i < ripples.length; i++) ripples[i].age += dt;
    ripples = ripples.filter(function (o) { return o.age < 2.5; });
    for (i = 0; i < rings.length; i++) rings[i].age += dt;
    rings = rings.filter(function (o) { return o.age < o.life; });
    if (shakeT > 0) shakeT -= dt;
  }
  function step(dt) {
    updFx(dt);
    var i, j;
    for (i = 0; i < poops.length; i++) integrate(poops[i], dt);
    for (i = 0; i < poops.length; i++)
      for (j = i + 1; j < poops.length; j++) collide(poops[i], poops[j]);
    var top = 1e9;
    poops.forEach(function (b) {
      top = Math.min(top, b.y);
      var inW = b.y > H * 0.08;   // crossing the surface fast makes a ripple
      if (b.wasIn !== undefined && b.wasIn !== inW) { var spd = Math.hypot(b.vx, b.vy); if (spd > W * 0.4) addRipple(b.x, Math.min(W * 0.04, spd * 0.012)); }
      b.wasIn = inW;
      b.parts.forEach(function (q) {
        var h = (H * 0.78 - (b.y + q.wy + q.r)) / (W * 1.2);   // metres above the water (1 m = 1.2 widths)
        if (h > maxHm) maxHm = h;
      });
    });
    if (roundOn) updateMax();
    if (poops.length) {   // camera follows the highest poop
      var camTarget = Math.min(0, top - H * 0.3);
      camY += (camTarget - camY) * (1 - Math.exp(-5 * dt));
      if (camY > -0.05) camY = 0;
    } else if (roundOn && !sparks.length && !chunks.length) endRound();
  }

  var waveY = [];
  function draw() {
    var waterY = H * 0.08;
    // wavy surface: two sine waves sampled at a few dozen points (cheap)
    var WN = 36, wt = performance.now() / 1000, wj;
    for (wj = 0; wj <= WN; wj++) { var wx = wj / WN * W; var wv = waterY + W * 0.007 * Math.sin(wx * 0.035 + wt * 1.6) + W * 0.004 * Math.sin(wx * 0.09 - wt * 2.3);
      for (var ri = 0; ri < ripples.length; ri++) {   // ripples spread out from where things hit or blast the surface
        var rp = ripples[ri], rd = Math.abs(wx - rp.x), fr = Math.max(0, Math.min(1, (rp.age * W * 0.9 - rd) / (W * 0.1)));
        if (fr > 0) wv += rp.amp * fr * Math.exp(-rd / (W * 0.5) - rp.age * 1.4) * Math.sin(rd * 0.08 - rp.age * 9);
      }
      waveY[wj] = wv;
    }
    function wavePath() {
      ctx.beginPath(); ctx.moveTo(0, waveY[0]);
      for (var j = 1; j <= WN; j++) ctx.lineTo(j / WN * W, waveY[j]);
      ctx.lineTo(W, H + 40); ctx.lineTo(0, H + 40); ctx.closePath();
    }
    ctx.save();
    if (shakeT > 0) { var sa = shakeA * Math.min(1, shakeT / 0.2); ctx.translate((Math.random() - 0.5) * 2 * sa, (Math.random() - 0.5) * 2 * sa); }
    ctx.translate(0, -camY);   // camera
    var alt = Math.min(1, -camY / (H * 4));
    var sky = ctx.createLinearGradient(0, camY, 0, waterY);
    sky.addColorStop(0, 'rgb(' + Math.round(159 - 139 * alt) + ',' + Math.round(216 - 186 * alt) + ',' + Math.round(255 - 175 * alt) + ')');
    sky.addColorStop(1, '#e3f4ff');
    ctx.fillStyle = sky; ctx.fillRect(0, camY - 40, W, waterY - camY + 40 + W * 0.03);
    var wg = ctx.createLinearGradient(0, waterY, 0, H);
    wg.addColorStop(0, '#3a9ad9'); wg.addColorStop(1, '#0d4f8b');
    ctx.fillStyle = wg; wavePath(); ctx.fill();
    ctx.fillStyle = '#7a6a48'; ctx.fillRect(0, H * 0.78, W, H * 0.22 + 40);
    ctx.fillStyle = '#9a8860'; ctx.fillRect(0, H * 0.78, W, 3);
    for (k = 0; k < pile.length; k++) { var pp = pile[k]; ctx.fillStyle = pp.col; ctx.beginPath(); ctx.ellipse(pp.x, pp.y, pp.size, pp.size * 0.72, pp.rot, 0, 6.2832); ctx.fill(); }
    var i, k, b, q;
    // height marks every 0.5 m (visible only when the camera is up)
    if (camY < -1) {
      var restY = H * 0.78, mpx = W * 1.2;   // pixels per metre
      var k0 = Math.max(1, Math.ceil((restY - (camY + H)) / mpx / 0.5)), k1 = Math.min(k0 + 40, Math.floor((restY - camY) / mpx / 0.5));
      ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.035) + 'px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 1.5; ctx.setLineDash([6, 8]);
      for (var hk = k0; hk <= k1; hk++) {
        var my = restY - hk * 0.5 * mpx;
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.moveTo(0, my); ctx.lineTo(W, my); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText((hk * 0.5).toFixed(1) + 'm', 6, my - 3);
      }
      ctx.setLineDash([]);
    }
    for (i = 0; i < poops.length; i++) {
      b = poops[i];
      for (k = 0; k < b.parts.length; k++) {
        q = b.parts[k];
        drawShape(ctx, q.shape, b.x + q.wx, b.y + q.wy, q.r, q.rot + b.th);
      }
    }
    ctx.fillStyle = 'rgba(30,120,200,0.45)'; wavePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, waveY[0]);
    for (wj = 1; wj <= WN; wj++) ctx.lineTo(wj / WN * W, waveY[wj]);
    ctx.stroke();
    if (maxHm > 0.02) {   // record line
      var by = H * 0.78 - maxHm * W * 1.2, lb = maxHm.toFixed(2) + 'm';
      ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.strokeStyle = '#ffd43b';
      ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = 'bold ' + Math.round(W * 0.05) + 'px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.lineWidth = 3;
      ctx.strokeStyle = '#7a4a00'; ctx.strokeText(lb, W - 8, by - 4);
      ctx.fillStyle = '#ffd43b'; ctx.fillText(lb, W - 8, by - 4);
    }
    for (k = 0; k < chunks.length; k++) {
      var ch = chunks[k];
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(ch.x, ch.y); ctx.rotate(ch.rot);
      ell(ctx, 0, 0, ch.size, ch.size * 0.72, ch.col);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // firework effects
    ctx.globalCompositeOperation = 'lighter';
    for (k = 0; k < rings.length; k++) {
      var rg = rings[k], t = rg.age / rg.life;
      ctx.globalAlpha = Math.max(0, 1 - t) * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.rMax * 0.35 * (1 - t * 0.5), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = Math.max(0, 1 - t);
      ctx.strokeStyle = rg.col; ctx.lineWidth = Math.max(2, W * 0.012 * (1 - t));
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.rMax * (0.2 + 0.8 * t), 0, Math.PI * 2); ctx.stroke();
    }
    for (k = 0; k < sparks.length; k++) {
      var sp2 = sparks[k], al = 1 - sp2.age / sp2.life;
      ctx.globalAlpha = al; ctx.fillStyle = sp2.col;
      ctx.beginPath(); ctx.arc(sp2.x, sp2.y, sp2.size * (0.5 + 0.5 * al), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  var last = 0, acc = 0;
  function loop(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (paused) { acc = 0; } else { acc += dt; }
    var FIXED = 1 / 120;
    while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
    draw();
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
